# Render Blueprint for Silver Skills AI.
# Deploy: on render.com, "New +" -> "Blueprint" -> select this repo -> Render reads this file.
#
# Service names below (silver-skills-backend / silver-skills-frontend) become part of the default
# *.onrender.com URLs. If either name is already taken, Render will suffix it (e.g. -a1b2) and you
# MUST update the two places that hardcode the other service's URL: the frontend's
# VITE_API_BASE_URL build env var below, and the backend's CLIENT_ORIGIN env var.
#
# Frontend and backend are on different onrender.com subdomains, so the frontend calls the
# backend directly (cross-origin, with credentials) instead of relying on a same-origin proxy —
# Render's static-site path rewrite to another Render service proved unreliable in testing.
#
# Database: Render's free Postgres plan auto-expires 90 days after creation (and cannot be
# resumed without upgrading to a paid instance), so the database is hosted on Supabase's free
# tier instead — set DATABASE_URL manually in the Render dashboard (see comment below).

services:
  - name: silver-skills-backend
    type: web
    runtime: node
    rootDir: backend
    plan: free
    # --include=dev is required here: NODE_ENV=production (below) makes plain `npm install` skip
    # devDependencies, but prisma/tsx/typescript (needed to build) are devDependencies. Without
    # this flag the build fails with "exit 127: command not found" on the first prisma/tsx call.
    buildCommand: npm install --include=dev && npm run build:prod
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Render's outbound network resolves Supabase's pooler hostname to an IPv6 address it can't
      # actually route, causing every DB connection to fail with a generic "Can't reach database
      # server" (confirmed: the same connection string worked immediately from a normal machine).
      # This forces Node's DNS resolution to prefer IPv4, which Render can route.
      - key: NODE_OPTIONS
        value: --dns-result-order=ipv4first
      - key: JWT_SECRET
        generateValue: true
      # Paste the Supabase Postgres connection string yourself in the Render dashboard
      # (Environment tab) — never commit a real connection string to git.
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_ORIGIN
        value: https://silver-skills-frontend.onrender.com
      - key: PORT
        value: 4000
      # Paste these two in the Render dashboard yourself (never commit real keys to git):
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: JOOBLE_API_KEY
        sync: false

  - name: silver-skills-frontend
    type: web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://silver-skills-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
